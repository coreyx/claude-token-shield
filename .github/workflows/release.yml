# Publishes a release (tech.md, "Distribution"; design D15).
#
# A pushed tag v<version> builds the plugin with every target's binaries
# (scripts/build-release.mjs), commits that folder as the root of the
# `release` branch, which .claude-plugin/marketplace.json installs from, and
# attaches per-target archives and their checksums to a GitHub Release.
# Binaries never land on main.
#
# Run by hand (workflow_dispatch), it builds and uploads the archives as a
# workflow artifact only: no branch is pushed and no release is made.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, never cancelled half-way through a push.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # A tag names the version; a manual run builds plugin.json's own.
      - name: Resolve the version
        id: version
        run: |
          manifest="$(node -p "require('./plugin/.claude-plugin/plugin.json').version")"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$manifest"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The full suite runs on every push in ci.yml; this guards the tagged
      # commit itself before anything is published from it.
      - name: Test
        run: |
          npm ci
          npm test
          go test ./...

      - name: Build every target
        run: node scripts/build-release.mjs "${{ steps.version.outputs.version }}"

      - name: Archive each target's binaries
        run: |
          version="${{ steps.version.outputs.version }}"
          mkdir -p dist/assets
          cd dist/plugin/bin
          for target in */; do
            target="${target%/}"
            name="token-shield-$version-$target"
            if [ "${target%%-*}" = windows ]; then
              zip -q -j "../../assets/$name.zip" "$target"/*
            else
              tar -czf "../../assets/$name.tar.gz" -C "$target" .
            fi
          done
          cd ../../assets
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Keep the build (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: token-shield-${{ steps.version.outputs.version }}
          path: dist/assets/

      # The release branch holds only the installable plugin, one commit per
      # release on top of the last, so an install fetches just what it runs.
      - name: Commit to the release branch
        if: github.ref_type == 'tag'
        run: |
          version="${{ steps.version.outputs.version }}"
          tree="$RUNNER_TEMP/release"
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin release > /dev/null; then
            git fetch origin release
            git worktree add -B release "$tree" origin/release
          else
            git worktree add --orphan -b release "$tree"
          fi
          find "$tree" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a dist/plugin/. "$tree/"
          cd "$tree"
          git add -A
          git commit -q -m "release: v$version" -m "Built from $GITHUB_SHA."
          git push origin release

      - name: Publish the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=(--generate-notes)
          if [ -f RELEASE_NOTES.md ]; then notes=(--notes-file RELEASE_NOTES.md); fi
          gh release create "$GITHUB_REF_NAME" dist/assets/* --verify-tag --title "Token Shield $GITHUB_REF_NAME" "${notes[@]}"
